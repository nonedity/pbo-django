{% load static %}
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CV{% endblock %}</title>
    <meta name="description" content="{% block description %}Curriculum Vitae pribadi{% endblock %}">
    <script>document.documentElement.classList.add('js');</script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'cv/css/style.css' %}">
</head>

<body class="bg-light" data-bs-spy="scroll" data-bs-target="#navMenu" data-bs-root-margin="0px 0px -60%"
    data-bs-smooth-scroll="true" tabindex="0">
    <a class="visually-hidden-focusable position-absolute p-2 bg-white" href="#utama">Lewati ke konten utama</a>

    {% block navbar %}{% endblock %}

    <main id="utama">
        {% block konten %}{% endblock %}
    </main>

    {% block footer %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'cv/js/script.js' %}"></script>
</body>

</html>
