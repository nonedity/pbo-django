{% extends "cv/base.html" %}
{% load static %}
<link rel="stylesheet" href="{% static 'cv/css/style.css' %}">
<script src="{% static 'cv/js/script.js' %}"></script>
{% block konten %}
<div class="container py-5">
    <img src="{% static 'cv/img/foto' %}" alt="Foto {{ profil.nama }}" class="rounded-circle shadow foto-profil">
    <h1>{{ profil.nama }}</h1>
    <p class="lead">{{ profil.profesi }}</p>
    <p>{{ profil.tentang }}</p>
    <ul class="list-group">
        {% for k in keahlian %}
        <li class="list-group-item">
            {{ k.nama }}
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
